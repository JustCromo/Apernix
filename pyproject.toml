[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apernix"
version = "0.9.6"
description = "Risk Assessment & VSPT (Vulnerability Scanning + Penetration Testing) per applicazioni web"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.scripts]
apernix = "apernix.cli:main"

[tool.setuptools.packages.find]
include = ["apernix*"]

[tool.setuptools.package-data]
apernix = ["locales/*.json", "assets/*.png"]
