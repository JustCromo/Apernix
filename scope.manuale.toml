# Scope di Apernix: SOLO i bersagli che hai il permesso di analizzare.
# Scritto dalla console guidata; puoi modificarlo anche a mano (permessi 600).

[authorization]
confirmed = true

[[target]]
url = "https://192.168.1.187:443/"
name = "Racoonix"
