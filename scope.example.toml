# Scope di Apernix: SOLO i bersagli che hai il permesso di analizzare.
# Copia questo file in scope.toml (che git ignora) e poi: chmod 600 scope.toml

[authorization]
# Metti true solo se il proprietario della web application ti ha autorizzato.
confirmed = false
owner = ""

[[target]]
url = "http://127.0.0.1:8000/"
name = "La mia web application"
# Solo per HTTPS con una CA interna (es. Caddy con "tls internal"): file PEM della CA,
# percorso relativo alla cartella di questo file. Apernix si fida solo di quella CA.
# ca_file = "racoonix-ca.crt"

[network]
# Porte che nmap controlla sugli host dei bersagli:
# none (nessuna), top100, top1000, all, oppure un elenco come "22,80,443,8000-8100"
ports = "top1000"

[limits]
rate = 5             # richieste al secondo (0.1 - 50)
max_requests = 300   # tetto di richieste per analisi (1 - 10000)
timeout = 10         # secondi di attesa per risposta (1 - 120)
# rate e timeout valgono anche per nuclei; max_requests conta solo le richieste di Apernix
